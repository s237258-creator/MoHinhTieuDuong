server.port=${PORT:8080}
spring.datasource.url=${SQLSERVER_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=MoHinhTieuDuong;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SQLSERVER_USERNAME:sa}
spring.datasource.password=${SQLSERVER_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
app.jwt.secret=${SECRET_KEY:local-development-secret-change-before-deploy-32-bytes}
app.jwt.expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:1440}
app.bootstrap-admin.phone=${BOOTSTRAP_ADMIN_PHONE:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:System Administrator}
app.model.resource=/model.json
